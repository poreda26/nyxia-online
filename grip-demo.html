<!doctype html><html lang="tr"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyxia — Silah tutuşu örneği</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e10;color:#eee4cf;font:15px system-ui}main{max-width:460px;margin:20px auto;padding:18px;background:#101b1c;border:1px solid #4c5141;border-radius:18px}small{color:#b6a174;letter-spacing:2px}h1{font-size:24px;margin:10px 0}p{color:#aebdbc;line-height:1.5}.stage{overflow:hidden;border-radius:12px;background:#101b1c}.actor{width:100%;aspect-ratio:3/4;background:url('./demos/warrior-grip-v1.png') 0 0/200% 100% no-repeat;transform-origin:50% 94%;animation:breathe 3s ease-in-out infinite}.actor.axe{background-position:100% 0}.actor.strike{animation:strike .65s ease-in-out}.choices{display:flex;gap:10px;margin:15px 0}button{flex:1;padding:14px 8px;border:1px solid #56655f;border-radius:9px;background:#1b2b2b;color:#e8e3d5;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#d0a46a;background:#533d29}#attack{width:100%;background:#b7793e;color:#fff;border:0;font-weight:700}button:focus-visible{outline:2px solid #efca83;outline-offset:3px}#status{text-align:center;color:#dec28e;min-height:24px;margin-top:8px}@keyframes breathe{50%{transform:scaleY(1.008)}}@keyframes strike{0%,100%{transform:translateX(0)}20%{transform:translateX(-2%) rotate(-2deg)}48%{transform:translateX(5%) rotate(3deg)}72%{transform:translateX(2%)}}@media(prefers-reduced-motion:reduce){.actor,.actor.strike{animation:none}}@media(max-width:480px){main{margin:0;border-radius:0;border:0}.actor{max-height:58vh;background-size:200% 100%}}
</style>
<main><small>NYXIA · GÖRSEL DENEME</small><h1>Aynı savaşçı, doğru tutuş.</h1><p>Silah seçerek ellerin ve tutuşun nasıl değiştiğine bak.</p><div class="stage"><div id="actor" class="actor" role="img" aria-label="Közdiş kılıcını iki eliyle tutan savaşçı"></div></div><div class="choices"><button id="sword" aria-pressed="true">Közdiş · Kılıç</button><button id="axe" aria-pressed="false">Gökyarık · Balta</button></div><button id="attack">Hamleyi dene</button><div id="status" aria-live="polite">Közdiş kuşanıldı</div><p><small>Tek karakter örneği. Bekleme ve hamle hareketi basit animasyondur. Ana oyun ve kayıtlar değişmez.</small></p></main>
<style>@media(max-width:480px){.actor{width:min(100%,43.5vh);max-height:none;margin:auto}}</style>
<script>
const actor=document.querySelector('#actor'),status=document.querySelector('#status');let active='sword';
for(const id of ['sword','axe'])document.getElementById(id).onclick=()=>{active=id;actor.className='actor'+(id==='axe'?' axe':'');for(const other of ['sword','axe'])document.getElementById(other).setAttribute('aria-pressed',String(other===id));actor.setAttribute('aria-label',id==='axe'?'Gökyarık baltasını iki eliyle tutan savaşçı':'Közdiş kılıcını iki eliyle tutan savaşçı');status.textContent=(id==='axe'?'Gökyarık':'Közdiş')+' kuşanıldı'};
document.querySelector('#attack').onclick=()=>{actor.classList.remove('strike');void actor.offsetWidth;actor.classList.add('strike');status.textContent='Hamle';};actor.addEventListener('animationend',()=>{actor.classList.remove('strike');status.textContent=(active==='axe'?'Gökyarık':'Közdiş')+' kuşanıldı'});
</script></html>
