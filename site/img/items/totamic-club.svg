<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Totamic Club (Normal, T3) — Iron Impact'in (endüstriyel
       çelik) ve Hell Breaker'ın (cehennemi metal) aksine, oyulmuş bir
       ahşap kabile topuzu: kahverengi gövde, geometrik totem oymaları,
       tüy püskülü, ucunda küçük bir kemik/diş süsü. Lightning Damage
       teması yine sarı-beyaz kıvılcımlarla temsil ediliyor. -->
  <g>
    <!-- uzun sap (haft) -->
    <rect x="7" y="10" width="1" height="5" fill="#5C3A1A" />
    <rect x="8" y="10" width="1" height="5" fill="#3E2612" />
    <rect x="7" y="14" width="2" height="1" fill="#241407" />

    <!-- deri sarım (leather wrap band) -->
    <rect x="6" y="11" width="4" height="1" fill="#8B6A2E" />

    <!-- ahşap topuz başı (carved wooden club head) -->
    <rect x="5" y="6" width="6" height="4" fill="#8B5A2B" />
    <rect x="5" y="6" width="6" height="1" fill="#A9713A" />
    <rect x="5" y="9" width="6" height="1" fill="#6B4520" />

    <!-- totem oymaları (geometric totem carvings) -->
    <rect x="6" y="7" width="1" height="1" fill="#3E2612" />
    <rect x="9" y="7" width="1" height="1" fill="#3E2612" />
    <rect x="7" y="8" width="2" height="1" fill="#3E2612" opacity="0.8" />

    <!-- tüy püskülü (feather tuft) -->
    <rect x="4" y="7" width="1" height="1" fill="#EAF0FF" />
    <rect x="3" y="8" width="1" height="1" fill="#B7C0E0" />
    <rect x="11" y="7" width="1" height="1" fill="#E8734A" />

    <!-- kemik/diş süsü (bone charm at the top) -->
    <rect x="7" y="4" width="2" height="2" fill="#EAF0FF" />
    <rect x="7" y="5" width="2" height="1" fill="#B7C0E0" />

    <!-- yıldırım kıvılcımları (lightning sparks) -->
    <rect x="6" y="6" width="1" height="1" fill="#F2D149" opacity="0.9" />
    <rect x="9" y="8" width="1" height="1" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
