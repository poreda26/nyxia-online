<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Bamboo Bow (Normal, T1) — Bow'un biraz daha ihtişamlı
       hali. Aynı C-eğrisi iskeleti ama bambu yeşili gövde ve düğüm
       (segment) çizgileriyle Bow'dan net ayrışıyor. -->
  <g>
    <!-- yay gövdesi (C eğrisi) -->
    <rect x="11" y="2" width="1" height="1" fill="#6B8E3A" />
    <rect x="10" y="3" width="1" height="1" fill="#6B8E3A" />
    <rect x="9" y="4" width="1" height="2" fill="#6B8E3A" />
    <rect x="8" y="6" width="1" height="4" fill="#6B8E3A" />
    <rect x="9" y="10" width="1" height="2" fill="#6B8E3A" />
    <rect x="10" y="12" width="1" height="1" fill="#6B8E3A" />
    <rect x="11" y="13" width="1" height="1" fill="#6B8E3A" />
    <!-- bambu düğümleri (segment rings) -->
    <rect x="10" y="3" width="1" height="1" fill="#4A6329" />
    <rect x="8" y="7" width="1" height="1" fill="#8FB84C" />
    <rect x="8" y="9" width="1" height="1" fill="#4A6329" />
    <rect x="10" y="12" width="1" height="1" fill="#4A6329" />

    <!-- kiriş -->
    <rect x="12" y="2" width="1" height="12" fill="#D8D0C0" opacity="0.85" />

    <!-- ok -->
    <rect x="4" y="7" width="7" height="1" fill="#4A6329" />
    <rect x="3" y="7" width="1" height="1" fill="#B0B0B0" />
    <rect x="10" y="6" width="1" height="1" fill="#D8D0C0" />
    <rect x="10" y="8" width="1" height="1" fill="#D8D0C0" />
  </g>
</svg>
