<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Bow (Normal, T1) — oyunun en güçsüz, en sade yayı. Düz
       ahşap gövde, süslemesiz, kısa bir avcı yayı. Diğer 7 yaydan (bambu
       yeşili, demir gri, zehir yeşili, çelik mavisi, alev kahverengisi,
       yıldırım moru, altın-beyaz) bilinçli olarak en yalın renk paleti. -->
  <g>
    <!-- yay gövdesi (C eğrisi) -->
    <rect x="11" y="2" width="1" height="1" fill="#6B4520" />
    <rect x="10" y="3" width="1" height="1" fill="#6B4520" />
    <rect x="9" y="4" width="1" height="2" fill="#6B4520" />
    <rect x="8" y="6" width="1" height="4" fill="#6B4520" />
    <rect x="9" y="10" width="1" height="2" fill="#6B4520" />
    <rect x="10" y="12" width="1" height="1" fill="#6B4520" />
    <rect x="11" y="13" width="1" height="1" fill="#6B4520" />
    <!-- gövde parlaklığı -->
    <rect x="8" y="7" width="1" height="2" fill="#8B5A2B" />

    <!-- kiriş (string) -->
    <rect x="12" y="2" width="1" height="12" fill="#D8D0C0" opacity="0.85" />

    <!-- ok (arrow) -->
    <rect x="4" y="7" width="7" height="1" fill="#5C3A1A" />
    <rect x="3" y="7" width="1" height="1" fill="#8A8A8A" />
    <rect x="10" y="6" width="1" height="1" fill="#D8D0C0" />
    <rect x="10" y="8" width="1" height="1" fill="#D8D0C0" />
  </g>
</svg>
