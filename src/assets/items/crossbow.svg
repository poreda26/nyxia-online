<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Crossbow (Normal, T2) — Iron Crossbow'un aynı yatay-kollu
       arbalet iskeleti ama daha sade/işlenmemiş: ham koyu ahşap dipçik,
       süslemesiz düz gri demir kollar, hiç parlak/mavi vurgu yok. Horn
       Crossbow'dan bilinçli olarak daha loş ve yalın. -->
  <g>
    <!-- yatay demir kollar (plain horizontal iron arms) -->
    <rect x="2" y="3" width="1" height="1" fill="#4A5068" />
    <rect x="3" y="4" width="10" height="1" fill="#6E6E6E" />
    <rect x="13" y="3" width="1" height="1" fill="#4A5068" />
    <rect x="3" y="5" width="10" height="1" fill="#3A3A3A" />

    <!-- kiriş -->
    <rect x="2" y="4" width="1" height="1" fill="#B0B0B0" />
    <rect x="13" y="4" width="1" height="1" fill="#B0B0B0" />

    <!-- ham ahşap dipçik (rough unfinished wood stock) -->
    <rect x="7" y="5" width="2" height="7" fill="#3E2E1E" />
    <rect x="7" y="5" width="1" height="7" fill="#5A4530" />

    <!-- demir bağlantı halkası -->
    <rect x="6" y="5" width="4" height="1" fill="#5A6478" />

    <!-- tetik mekanizması -->
    <rect x="7" y="12" width="2" height="1" fill="#242830" />
    <rect x="6" y="10" width="1" height="1" fill="#4A5068" />

    <!-- ok yatağı -->
    <rect x="5" y="4" width="5" height="1" fill="#6E6E6E" opacity="0.8" />
  </g>
</svg>
