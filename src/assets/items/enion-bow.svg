<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Enion Bow (Unique, T6) — Chitin Bow gibi muazzam ama
       elektrik-mor/mavi bir gövde, yıldırım çatlaklarıyla kaplı, çok
       ihtişamlı bir görünüm. -->
  <g>
    <!-- yay gövdesi (C eğrisi) -->
    <rect x="11" y="2" width="1" height="1" fill="#3A2A6E" />
    <rect x="10" y="3" width="1" height="1" fill="#3A2A6E" />
    <rect x="9" y="4" width="1" height="2" fill="#3A2A6E" />
    <rect x="8" y="6" width="1" height="4" fill="#3A2A6E" />
    <rect x="9" y="10" width="1" height="2" fill="#3A2A6E" />
    <rect x="10" y="12" width="1" height="1" fill="#3A2A6E" />
    <rect x="11" y="13" width="1" height="1" fill="#3A2A6E" />

    <!-- yıldırım çatlakları (lightning cracks across the body) -->
    <rect x="9" y="5" width="1" height="1" fill="#6F5FC9" />
    <rect x="8" y="7" width="1" height="1" fill="#F2D149" opacity="0.9" />
    <rect x="8" y="9" width="1" height="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="9" y="11" width="1" height="1" fill="#6F5FC9" />

    <!-- kiriş, elektrikli parıltı -->
    <rect x="12" y="2" width="1" height="12" fill="#4FC3D9" opacity="0.8" />

    <!-- ok, mor ışıltılı -->
    <rect x="4" y="7" width="7" height="1" fill="#2A1E52" />
    <rect x="3" y="7" width="1" height="1" fill="#F2D149" />
    <rect x="10" y="6" width="1" height="1" fill="#6F5FC9" />
    <rect x="10" y="8" width="1" height="1" fill="#6F5FC9" />
  </g>
</svg>
