<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Horn Crossbow (Normal, T2) — sade Crossbow'dan daha
       ihtişamlı: boynuz/kemik renkli kollar (krem-bej), cilalı koyu ahşap
       dipçik, uçlarda ince altın bağlantılar. -->
  <g>
    <!-- yatay boynuz kollar (horn-colored horizontal arms) -->
    <rect x="2" y="3" width="1" height="1" fill="#8A6A3A" />
    <rect x="3" y="4" width="10" height="1" fill="#D8C39A" />
    <rect x="13" y="3" width="1" height="1" fill="#8A6A3A" />
    <rect x="3" y="5" width="10" height="1" fill="#A8895C" />

    <!-- kiriş -->
    <rect x="2" y="4" width="1" height="1" fill="#EAF0FF" />
    <rect x="13" y="4" width="1" height="1" fill="#EAF0FF" />

    <!-- cilalı ahşap dipçik (polished dark wood stock) -->
    <rect x="7" y="5" width="2" height="7" fill="#4A2E1A" />
    <rect x="7" y="5" width="1" height="7" fill="#6B4520" />

    <!-- altın bağlantı halkası (gold binding ring) -->
    <rect x="6" y="5" width="4" height="1" fill="#D4AF6A" />

    <!-- boynuz uç vurguları (horn tip accents) -->
    <rect x="2" y="2" width="1" height="1" fill="#EACD9A" />
    <rect x="13" y="2" width="1" height="1" fill="#EACD9A" />

    <!-- tetik mekanizması -->
    <rect x="7" y="12" width="2" height="1" fill="#2A1E10" />
    <rect x="6" y="10" width="1" height="1" fill="#8A6A3A" />

    <!-- ok yatağı -->
    <rect x="5" y="4" width="5" height="1" fill="#D4AF6A" opacity="0.7" />
  </g>
</svg>
