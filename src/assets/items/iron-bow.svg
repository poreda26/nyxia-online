<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Iron Bow (Normal, T5) — oldukça güçlü ve ihtişamlı,
       parlak çelik-mavi gövde, iki katlı (laminated) uç görünümü. -->
  <g>
    <!-- yay gövdesi (C eğrisi) -->
    <rect x="11" y="2" width="1" height="1" fill="#5A6478" />
    <rect x="10" y="3" width="1" height="1" fill="#7E8CA8" />
    <rect x="9" y="4" width="1" height="2" fill="#7E8CA8" />
    <rect x="8" y="6" width="1" height="4" fill="#7E8CA8" />
    <rect x="9" y="10" width="1" height="2" fill="#7E8CA8" />
    <rect x="10" y="12" width="1" height="1" fill="#7E8CA8" />
    <rect x="11" y="13" width="1" height="1" fill="#5A6478" />

    <!-- parlak çelik vurgusu -->
    <rect x="8" y="7" width="1" height="2" fill="#B7C0E0" />
    <rect x="9" y="5" width="1" height="1" fill="#EAF0FF" />
    <rect x="9" y="10" width="1" height="1" fill="#EAF0FF" />

    <!-- uç kapakları (steel tip caps) -->
    <rect x="12" y="2" width="1" height="1" fill="#EAF0FF" />
    <rect x="12" y="13" width="1" height="1" fill="#EAF0FF" />

    <!-- kiriş -->
    <rect x="12" y="3" width="1" height="10" fill="#EAF0FF" opacity="0.85" />

    <!-- ok -->
    <rect x="4" y="7" width="7" height="1" fill="#4A5068" />
    <rect x="3" y="7" width="1" height="1" fill="#EAF0FF" />
    <rect x="10" y="6" width="1" height="1" fill="#EAF0FF" />
    <rect x="10" y="8" width="1" height="1" fill="#EAF0FF" />
  </g>
</svg>
