<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art: Scorpion Bow (Unique, T4) — Iron Crossbow'dan daha
       ihtişamlı: zehir-yeşili/siyah bir gövde, akrep kuyruğu gibi kıvrılan
       bir uç kancası, zehir damlacığı vurguları. -->
  <g>
    <!-- yay gövdesi (C eğrisi) -->
    <rect x="11" y="3" width="1" height="1" fill="#2E4A2E" />
    <rect x="10" y="4" width="1" height="1" fill="#2E4A2E" />
    <rect x="9" y="5" width="1" height="2" fill="#2E4A2E" />
    <rect x="8" y="7" width="1" height="3" fill="#2E4A2E" />
    <rect x="9" y="10" width="1" height="2" fill="#2E4A2E" />
    <rect x="10" y="12" width="1" height="1" fill="#2E4A2E" />

    <!-- akrep kuyruğu kancası (curling scorpion-tail hook at the tip) -->
    <rect x="11" y="2" width="1" height="1" fill="#1A2E1A" />
    <rect x="12" y="2" width="1" height="1" fill="#A8D95F" />

    <!-- zehir parlaklığı (poison glow highlights) -->
    <rect x="8" y="8" width="1" height="1" fill="#A8D95F" opacity="0.9" />
    <rect x="9" y="6" width="1" height="1" fill="#6FCF6F" opacity="0.7" />
    <rect x="9" y="11" width="1" height="1" fill="#6FCF6F" opacity="0.7" />

    <!-- kiriş -->
    <rect x="12" y="3" width="1" height="10" fill="#C9E8B0" opacity="0.75" />

    <!-- ok -->
    <rect x="4" y="8" width="7" height="1" fill="#1A2E1A" />
    <rect x="3" y="8" width="1" height="1" fill="#A8D95F" />
    <rect x="10" y="7" width="1" height="1" fill="#C9E8B0" />
    <rect x="10" y="9" width="1" height="1" fill="#C9E8B0" />
  </g>
</svg>
